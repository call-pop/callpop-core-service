<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>CallPop STOMP 테스트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', sans-serif; }
    body { margin: 20px; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    input[type="text"], input[type="number"], textarea {
      padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 100%;
    }
    label { min-width: 110px; }
    button { padding: 8px 12px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button.secondary { background: #64748b; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #log { border: 1px solid #e5e7eb; min-height: 180px; padding: 10px; border-radius: 8px; background: #fafafa; overflow: auto; }
    .pill { display:inline-block; padding:2px 6px; border-radius: 999px; font-size: 12px; background:#e2e8f0; margin-right:6px; }
    .msg { margin: 6px 0; }
    .ok { color: #16a34a; }
    .err { color: #dc2626; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <h2>CallPop WebSocket/STOMP 테스트</h2>

  <div class="row">
    <label for="baseUrl">서버 베이스 URL</label>
    <input id="baseUrl" type="text" placeholder="예: http://localhost:8080" />
  </div>

  <div class="row">
    <label for="jwt">JWT 토큰</label>
    <input id="jwt" type="text" placeholder="Bearer 없이 토큰만 입력 (선택)" />
  </div>

  <div class="row">
    <label for="roomId">방 ID</label>
    <input id="roomId" type="number" placeholder="예: 1" />
  </div>

  <div class="row">
    <button id="btnConnect">연결</button>
    <button id="btnDisconnect" class="secondary" disabled>연결해제</button>
    <span class="muted" id="status">대기 중…</span>
  </div>

  <hr />

  <h3>구독/수신</h3>
  <div class="row">
    <label>Topics</label>
    <div>
      <span class="pill">/topic/rooms/{roomId}</span>
      <span class="pill">/topic/rooms/{roomId}/read</span>
    </div>
  </div>
  <div id="log"></div>

  <hr />

  <h3>메시지 전송</h3>
  <div class="row">
    <label for="sender">보내는 사람(옵션)</label>
    <input id="sender" type="text" placeholder="JWT 인증이면 생략 가능(서버가 Principal 사용)" />
  </div>
  <div class="row">
    <label for="content">내용</label>
    <input id="content" type="text" placeholder="메시지 내용" />
    <button id="btnSend">/app/rooms/{roomId}/send</button>
  </div>

  <h3>읽음 이벤트</h3>
  <div class="row">
    <label for="reader">읽은 사람(옵션)</label>
    <input id="reader" type="text" placeholder="JWT 인증이면 생략 가능" />
  </div>
  <div class="row">
    <button id="btnRead">/app/rooms/{roomId}/read</button>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const baseUrlEl = document.getElementById('baseUrl');
    const jwtEl = document.getElementById('jwt');
    const roomIdEl = document.getElementById('roomId');
    const statusEl = document.getElementById('status');
    const senderEl = document.getElementById('sender');
    const contentEl = document.getElementById('content');
    const readerEl = document.getElementById('reader');

    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnSend = document.getElementById('btnSend');
    const btnRead = document.getElementById('btnRead');

    let client = null;   // 전역 참조
    let subs = [];

    const addLog = (text, css='') => {
      const div = document.createElement('div');
      div.className = `msg ${css}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    };

    const enableButtons = (connected) => {
      btnConnect.disabled = connected;
      btnDisconnect.disabled = !connected;
      btnSend.disabled = !connected;
      btnRead.disabled = !connected;
      statusEl.textContent = connected ? '연결됨' : '연결 끊김';
    };

    function connect() {
      const baseUrl = (baseUrlEl.value || window.location.origin).replace(/\/$/, '');
      const token = jwtEl.value?.trim();
      const roomId = roomIdEl.value?.trim();

      if (!baseUrl) return addLog('서버 베이스 URL을 입력하세요.', 'err');
      if (!roomId) return addLog('roomId를 입력하세요.', 'err');

      // ⬇⬇ 전역 client에 "할당" (const로 새로 만들지 않음)
      client = new StompJs.Client({
        webSocketFactory: () => new SockJS(`${baseUrl}/ws`),
        connectHeaders: token ? { Authorization: `Bearer ${token}` } : {},
        debug: (str) => console.log('[STOMP]', str),
        reconnectDelay: 3000,
        onConnect: (frame) => {
          addLog('STOMP 연결 성공', 'ok');
          enableButtons(true);
          subscribeTopics(roomId);
        },
        onStompError: (frame) => {
          addLog(`브로커 에러: ${frame.headers['message']}`, 'err');
          if (frame.body) addLog(frame.body, 'err');
        },
        onWebSocketClose: (evt) => {
          addLog(`웹소켓 종료(code=${evt.code})`, 'err');
          enableButtons(false);
          subs = [];
        }
      });

      client.activate();
      addLog(`연결 시도 → ${baseUrl}/ws`);
      statusEl.textContent = '연결 중…';
    }

    function subscribeTopics(roomId) {
      // 이전 구독 정리
      subs.forEach((s) => { try { s.unsubscribe(); } catch {} });
      subs = [];

      // ✅ 서버는 메시지를 "/topic/rooms/{roomId}" 로 방송합니다.
      subs.push(client.subscribe(`/topic/rooms/${roomId}`, (msg) => {
        try {
          const body = JSON.parse(msg.body);
          addLog(`수신 메시지 ▸ ${JSON.stringify(body)}`);
        } catch {
          addLog(`수신(raw) ▸ ${msg.body}`);
        }
      }));

      // 읽음 이벤트 수신
      subs.push(client.subscribe(`/topic/rooms/${roomId}/read`, (msg) => {
        try {
          const body = JSON.parse(msg.body);
          addLog(`읽음 이벤트 ▸ ${JSON.stringify(body)}`, 'muted');
        } catch {
          addLog(`읽음 이벤트(raw) ▸ ${msg.body}`, 'muted');
        }
      }));

      addLog(`구독 완료: /topic/rooms/${roomId}, /topic/rooms/${roomId}/read`, 'ok');
    }

    function disconnect() {
      if (client && client.active) {
        subs.forEach((s) => { try { s.unsubscribe(); } catch {} });
        subs = [];
        client.deactivate();
        addLog('연결 해제 요청', 'muted');
      } else {
        addLog('이미 연결 해제됨', 'muted');
      }
      enableButtons(false);
    }

    function sendMessage() {
      if (!client || !client.connected) return addLog('먼저 연결하세요.', 'err');

      const roomId = roomIdEl.value.trim();
      const content = contentEl.value.trim();
      if (!content) return addLog('메시지 내용을 입력하세요.', 'err');

      const payload = {
        content: content,
        senderId: senderEl.value || undefined // JWT 인증 시 서버가 Principal 사용
      };

      client.publish({
        destination: `/app/rooms/${roomId}/send`,
        body: JSON.stringify(payload)
      });
      addLog(`송신 → /app/rooms/${roomId}/send :: ${JSON.stringify(payload)}`, 'ok');
      contentEl.value = '';
    }

    function sendRead() {
      if (!client || !client.connected) return addLog('먼저 연결하세요.', 'err');

      const roomId = roomIdEl.value.trim();
      const payload = {
        readerId: readerEl.value || undefined
      };

      client.publish({
        destination: `/app/rooms/${roomId}/read`,
        body: JSON.stringify(payload)
      });
      addLog(`송신(읽음) → /app/rooms/${roomId}/read :: ${JSON.stringify(payload)}`, 'ok');
    }

    // 버튼 이벤트
    document.getElementById('btnConnect').addEventListener('click', connect);
    document.getElementById('btnDisconnect').addEventListener('click', disconnect);
    document.getElementById('btnSend').addEventListener('click', sendMessage);
    document.getElementById('btnRead').addEventListener('click', sendRead);

    // 기본값
    document.getElementById('baseUrl').value = window.location.origin;
    document.getElementById('roomId').value = '1';
  </script>
</body>
</html>
